[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-common"
version = "0.1.0.dev0"
description = "What both commerce agent roles build on: config, fencing, memory, skills, grounding, presentation, the executor frame, and the event protocol."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = ["License :: OSI Approved :: Apache Software License"]
authors = [{ name = "Anthropic" }]
dependencies = [
  # 0.91 adds AsyncAnthropicBedrockMantle, the newest platform client docs/deployment.md
  # and tests/test_platform_seams.py use.
  "anthropic>=0.91",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The optional modules: commerce_common.agent_sdk and commerce_common.mcp_server.
sdk = ["claude-agent-sdk>=0.2.139", "mcp>=1.2,<2"]
mcp = ["mcp>=1.2,<2"]
# This repo's own verification loop and its runnable examples. scripts/install.sh and CI
# install [examples] through requirements.txt and the test tools through requirements-dev.txt;
# [dev] is the unpinned equivalent for a standalone install of this package.
# ruff is bounded to one formatter style so a new release cannot fail `ruff format --check`.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.15,<0.17", "httpx>=0.27", "mcp>=1.2,<2"]
examples = [
  # 0.132 made JSON bodies require a JSON content type, which keeps a cross-site form
  # POST out of the demo APIs.
  "fastapi>=0.132",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["commerce_common"]
